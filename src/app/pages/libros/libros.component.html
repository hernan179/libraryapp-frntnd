<router-outlet></router-outlet>
@if (!hasChildActive()) {
<div class="mat-shadow-2">
<table mat-table [dataSource]='dataSource'>
     <ng-container matColumnDef="idLibro">
      <th mat-header-cell *matHeaderCellDef> idLibro </th>
      <td mat-cell *matCellDef="let row"> {{row.idLibro}} </td>
    </ng-container>
    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef> titulo </th>
      <td mat-cell *matCellDef="let row"> {{row.titulo}} </td>
    </ng-container>
    <ng-container matColumnDef="autor">
      <th mat-header-cell *matHeaderCellDef> autor </th>
      <td mat-cell *matCellDef="let row"> {{row.autor}} </td>
    </ng-container>
        <ng-container matColumnDef="isbn">
      <th mat-header-cell *matHeaderCellDef> isbn </th>
      <td mat-cell *matCellDef="let row"> {{row.isbn}} </td>
    </ng-container>
    <ng-container matColumnDef="disponible">
      <th mat-header-cell *matHeaderCellDef> disponible </th>
      <td mat-cell *matCellDef="let row"> {{row.disponible}} </td>
    </ng-container>
        <ng-container matColumnDef="categoria">
      <th mat-header-cell *matHeaderCellDef> categoria </th>
      <td mat-cell *matCellDef="let row"> {{row.categoria.nombre}} </td>
    </ng-container>

    <ng-container matColumnDef="accion">
      <th mat-header-cell *matHeaderCellDef>Accion</th>
      <td mat-cell *matCellDef="let row">
        <button mat-flat-button [routerLink]="['edit', row.idLibro]">
          <span>Edit</span>
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-flat-button class="cancel-button" (click)="delete(row.idLibro)">
          <span>Delete</span>
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
<button mat-fab style="float: right;" routerLink="/pages/libros/new">
  <mat-icon>add</mat-icon>
</button>

</div>
}
