<h3>Clientes</h3>

<mat-form-field appearance="outline">
  <mat-label>Filter clients</mat-label>
  <input matInput (input)="applyFilter($event)" placeholder="Name, surname or ID">
</mat-form-field>

<div class="mat-shadow-2">
  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container matColumnDef="idCliente">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.idCliente }}</td>
    </ng-container>

    <ng-container matColumnDef="nombres">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Names</th>
      <td mat-cell *matCellDef="let row">{{ row.nombres }}</td>
    </ng-container>

    <ng-container matColumnDef="apellidos">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Surnames</th>
      <td mat-cell *matCellDef="let row">{{ row.apellidos }}</td>
    </ng-container>

    <ng-container matColumnDef="cedula">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Document</th>
      <td mat-cell *matCellDef="let row">{{ row.cedula }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
      <td mat-cell *matCellDef="let row">{{ row.email ? 'Yes' : 'No' }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let row">
        <button mat-flat-button (click)="openDialog(row.idCliente)">
          <mat-icon>edit</mat-icon><span>Edit</span>
        </button>
        <button mat-flat-button class="cancel-button" (click)="delete(row.idCliente)">
          <mat-icon>delete</mat-icon><span>Delete</span>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
  <button mat-fab class="add-button" (click)="openDialog()" aria-label="Create client">
    <mat-icon>add</mat-icon>
  </button>
</div>
